services:
    api:
        build: .
        container_name: backend_api
        command: >
            uvicorn app.main:app
            --host 0.0.0.0
            --port 8000
            --reload
        volumes:
            - ./app:/app/app
        env_file:
            - .env
        ports:
            - "8000:8000"
        depends_on:
            - postgres
            - rabbbitmq

    worker:
        build: .
        container_name: backend_worker
        command: python -m app.workers.trainer
        volumes:
            - ./app:/app/app
        env_file:
            - .env
        depends_on:
            - postgres
            - rabbbitmq
        deploy:
            replicas: 2

    postgres:
        image: postgres:16
        container_name: backend_postgres
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        volumes:
            - pgdata:/var/lib/postgresql/data
        ports:
            - "5432:5432"

    rabbbitmq:
        image: rabbitmq:3-management
        container_name: backend_rabbitmq
        environment:
            RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
            RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
        ports:
            - "5672:5672"
            - "15672:15672"

volumes:
    pgdata:
