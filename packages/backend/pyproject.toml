[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=9.5.8",
    "aiofiles>=25.1.0",
    "alembic>=1.18.3",
    "asyncpg>=0.31.0",
    "dotenv>=0.9.9",
    "eggp>=1.0.16",
    "fastapi[standard]>=0.128.0",
    "inference-query-language",
    "pandas>=3.0.0",
    "pika>=1.3.2",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "python-json-logger>=4.0.0",
    "reggression>=1.0.10",
    "sqlalchemy>=2.0.46",
    "uvicorn[standard]",
]

[tool.uv]
dev-dependencies = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
    "mypy",
    "pre-commit",
]

[tool.uv.sources]
inference-query-language = { workspace = true }
