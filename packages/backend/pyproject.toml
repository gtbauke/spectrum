[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=9.5.8",
    "aiofiles>=25.1.0",
    "alembic>=1.18.3",
    "asyncpg>=0.31.0",
    "dotenv>=0.9.9",
    "aioboto3>=13.4.0",
    "types-aiobotocore[s3]>=3.4.0",
    "eggp>=1.0.16",
    "email-validator>=2.2.0",
    "fastapi[standard]>=0.128.0",
    "inference-query-language",
    "pandas>=3.0.0",
    "pyarrow>=19.0.1",
    "pika>=1.3.2",
    "pydantic[email]>=2.12.5",
    "pydantic-settings>=2.12.0",
    "python-json-logger>=4.0.0",
    "reggression>=1.0.10",
    "sqlalchemy>=2.0.46",
    "uvicorn[standard]",
    "argon2-cffi>=25.1.0",
    "jose>=1.0.0",
    "python-jose[cryptography]>=3.5.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
    "mypy",
    "pre-commit",
    "pandas-stubs",
    "types-python-jose",
]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true

[tool.uv.sources]
inference-query-language = { workspace = true }

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
