server {
    listen 80;
    server_name _; 

    # Rota raiz - Vai para o seu servidor Node.js SSR
    location / {
        # Por padrão, aplicações Node rodam na 3000. 
        # Se o seu "npm run start" rodar em outra porta (ex: 4173), altere aqui!
        proxy_pass http://frontend:3000; 
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Rota da API - Continua indo para o FastAPI
    location /api/v1 {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
