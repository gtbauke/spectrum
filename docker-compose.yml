services:
    backend:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: backend
        environment:
            DATABASE_URL: ${DATABASE_URL}
        depends_on:
            - db
        restart: unless-stopped
        ports:
            - "3000:3000"
        command: >
            sh -c "
                npx prisma migrate deploy &&
                node dist/index.js
            "
    db:
        image: postgres:15
        container_name: db
        restart: unless-stopped
        ports:
            - "5432:5432"
        volumes:
          - pg_data:/var/lib/postgresql/data

volumes:
    pg_data:

