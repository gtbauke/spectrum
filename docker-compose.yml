services:
    postgres:
        image: postgres:16
        container_name: spectrum-postgres
        restart: unless-stopped
        env_file:
            - .env
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-postgres}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
            POSTGRES_DB: ${POSTGRES_DB:-spectrum}
        ports:
            - "${POSTGRES_PORT:-5432}:5432"
        volumes:
            - spectrum_pg_data:/var/lib/postgresql/data
            - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-spectrum}"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

    rabbitmq:
        image: rabbitmq:3.13-management
        container_name: spectrum-rabbitmq
        restart: unless-stopped
        env_file:
            - .env
        environment:
            RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
            RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
        ports:
            - "${RABBITMQ_PORT:-5672}:5672"
            - "15672:15672"
        volumes:
            - spectrum_rmq_data:/var/lib/rabbitmq
            - ./docker/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
            interval: 10s
            timeout: 10s
            retries: 10
            start_period: 30s

    migration:
        build:
            context: .
            target: build
        container_name: spectrum-migration
        working_dir: /app/packages/db_core
        command: ["uv", "run", "alembic", "upgrade", "head"]
        depends_on:
            postgres:
                condition: service_healthy
        env_file:
            - .env
        environment:
            - POSTGRES_HOST=postgres
            - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-spectrum}
            - FILE_STORAGE_SPECTRUM_DATA_PATH=/app/spectrum_data
            - UV_COMPILE_BYTECODE=0
            - PYTHONDONTWRITEBYTECODE=1

    backend:
        build:
            context: .
            target: build
        container_name: spectrum-backend
        restart: unless-stopped
        ports:
            - "8000:8000"
        depends_on:
            migration:
                condition: service_completed_successfully
            rabbitmq:
                condition: service_healthy
        env_file:
            - .env
        environment:
            - POSTGRES_HOST=postgres
            - RABBITMQ_HOST=rabbitmq
            - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-spectrum}
            - RABBITMQ_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/
            - FILE_STORAGE_SPECTRUM_DATA_PATH=/app/spectrum_data
            - ADMIN_API_KEY=${ADMIN_API_KEY:-changeme}
            - UV_COMPILE_BYTECODE=0
            - PYTHONDONTWRITEBYTECODE=1
        volumes:
            - ./packages/backend:/app/packages/backend
            - ./packages/core:/app/packages/core
            - ./packages/db_core:/app/packages/db_core
            - ./packages/inference_query_language:/app/packages/inference_query_language
            - ./spectrum_data:/app/spectrum_data
        working_dir: /app/packages/backend
        command: ["uv", "run", "fastapi", "dev", "app/main.py", "--host", "0.0.0.0", "--port", "8000"]

    worker-training:
        build:
            context: .
            target: build
        container_name: spectrum-worker-training
        restart: unless-stopped
        depends_on:
            rabbitmq:
                condition: service_healthy
            migration:
                condition: service_completed_successfully
        env_file:
            - .env
        environment:
            - WORKER_TYPE=training
            - POSTGRES_HOST=postgres
            - RABBITMQ_HOST=rabbitmq
            - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-spectrum}
            - RABBITMQ_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/
            - FILE_STORAGE_SPECTRUM_DATA_PATH=/app/spectrum_data
            - UV_COMPILE_BYTECODE=0
            - PYTHONDONTWRITEBYTECODE=1
        volumes:
            - ./packages/workers:/app/packages/workers
            - ./packages/core:/app/packages/core
            - ./packages/db_core:/app/packages/db_core
            - ./spectrum_data:/app/spectrum_data
        working_dir: /app/packages/workers
        command: ["uv", "run", "python", "main.py"]

    worker-verification:
        build:
            context: .
            target: build
        container_name: spectrum-worker-verification
        restart: unless-stopped
        depends_on:
            rabbitmq:
                condition: service_healthy
            migration:
                condition: service_completed_successfully
        env_file:
            - .env
        environment:
            - WORKER_TYPE=verification
            - POSTGRES_HOST=postgres
            - RABBITMQ_HOST=rabbitmq
            - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-spectrum}
            - RABBITMQ_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/
            - FILE_STORAGE_SPECTRUM_DATA_PATH=/app/spectrum_data
            - UV_COMPILE_BYTECODE=0
            - PYTHONDONTWRITEBYTECODE=1
        volumes:
            - ./packages/workers:/app/packages/workers
            - ./packages/core:/app/packages/core
            - ./packages/db_core:/app/packages/db_core
            - ./spectrum_data:/app/spectrum_data
        working_dir: /app/packages/workers
        command: ["uv", "run", "python", "main.py"]

    worker-iql:
        build:
            context: .
            target: build
        container_name: spectrum-worker-iql
        restart: unless-stopped
        depends_on:
            rabbitmq:
                condition: service_healthy
            migration:
                condition: service_completed_successfully
        env_file:
            - .env
        environment:
            - WORKER_TYPE=iql
            - POSTGRES_HOST=postgres
            - RABBITMQ_HOST=rabbitmq
            - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-spectrum}
            - RABBITMQ_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/
            - FILE_STORAGE_SPECTRUM_DATA_PATH=/app/spectrum_data
            - UV_COMPILE_BYTECODE=0
            - PYTHONDONTWRITEBYTECODE=1
        volumes:
            - ./packages/workers:/app/packages/workers
            - ./packages/core:/app/packages/core
            - ./packages/db_core:/app/packages/db_core
            - ./packages/inference_query_language:/app/packages/inference_query_language
            - ./spectrum_data:/app/spectrum_data
        working_dir: /app/packages/workers
        command: ["uv", "run", "python", "main.py"]

    frontend:
        build:
            context: ./packages/frontend
            target: development
        container_name: spectrum-frontend
        restart: unless-stopped
        ports:
            - "5173:5173"
        env_file:
            - .env
        environment:
            - VITE_API_BASE_URL=http://localhost:8000/api/v1
        volumes:
            - ./packages/frontend:/app
            - /app/node_modules
        command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]

volumes:
    spectrum_pg_data:
    spectrum_rmq_data:
